<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.jpg" type="image/x-icon">
    <title>Busca CEP Integrada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Localizador Postal</h1>
            
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('cep')">Tenho o CEP</button>
                <button class="tab-btn" onclick="switchTab('address')">Tenho o Endereço</button>
            </div>
        </div>

        <div class="content-area">
            
            <div id="view-cep" class="view-section active">
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
                    Digite o CEP para ver os detalhes (BrasilAPI)
                </p>
                <form id="form-cep">
                    <div class="form-group">
                        <input type="text" id="input-cep" placeholder="00000-000" maxlength="9" style="text-align: center; letter-spacing: 1px; font-size: 1.2rem;">
                    </div>
                    <button type="submit" class="btn-action">Buscar Dados</button>
                </form>

                <div id="msg-cep" class="status-msg"></div>

                <div id="result-cep" class="result-box" style="display: none;">
                    <div class="card-single">
                        <span class="cep-badge" style="display: inline-flex; margin-bottom: 10px;" id="res-cep-badge"></span>
                        
                        <div class="data-label">LOGRADOURO</div>
                        <div class="data-value" id="res-street"></div>

                        <div class="data-label">BAIRRO</div>
                        <div class="data-value" id="res-neighborhood"></div>

                        <div class="data-label">CIDADE / UF</div>
                        <div class="data-value" id="res-city-uf"></div>
                    </div>
                </div>
            </div>

            <div id="view-address" class="view-section">
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
                    Encontre o CEP pelo nome do Logradouro
                </p>
                <form id="form-address">
                    <div style="display: grid;gap: 10px;">
                        <div class="form-group">
                            <label>Cidade</label>
                            <select id="input-city">
                                <option value="ITANHAEM">Itanhaém</option>
                                <option value="PERUIBE">Peruíbe</option>
                                <option value="Mongagua">Mongaguá</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Nome da Rua (ou parte)</label>
                        <input type="text" id="input-street" placeholder="Ex: Rui Barbosa">
                    </div>
                    <button type="submit" class="btn-action">Pesquisar Lista</button>
                </form>

                <div id="msg-address" class="status-msg"></div>

                <div id="result-list" class="result-box" style="display: none;">
                </div>
            </div>

        </div>
    </div>

    <div id="toast" class="toast">Copiado para a área de transferência!</div>

    <script src="script.js"></script>
</body>
</html>
